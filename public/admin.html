<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B0E13">
<title>GACOR LUDO — Dashboard Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css?v=4.5">
<style>
/* admin-only extra styles */
#scr-admin{max-width:980px;margin:0 auto;padding:26px 18px 40px;display:flex;flex-direction:column;gap:18px}
.aHead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.aHead h1{font-family:'Fredoka';font-size:30px;margin:0}
.aHead h1 span{color:var(--gold)}
.statRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.stat .n{font-family:'Fredoka';font-size:30px;font-weight:700;color:var(--gold)}
.stat .l{font-size:11px;letter-spacing:2px;color:var(--mut);margin-top:2px}
.aCard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.aCard h2{font-family:'Fredoka';font-size:16px;letter-spacing:2px;margin:0;color:var(--mut);display:flex;justify-content:space-between;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase}
td .pw{font-family:monospace;color:var(--gold);cursor:pointer}
tr.on{color:#2FBF71}
.aBtns{display:flex;gap:8px;flex-wrap:wrap}
.aBtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:600;transition:.15s}
.aBtn:hover{border-color:var(--gold);color:var(--gold)}
.aBtn.danger:hover{border-color:var(--red);color:var(--red)}
.pwForm{display:flex;gap:8px;flex-wrap:wrap}
.pwForm input{flex:1;min-width:140px;background:#0C1017;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:9px 12px;outline:none;font-size:13px}
.pwForm input:focus{border-color:var(--gold)}
.chatLine{display:flex;gap:8px;font-size:12.5px;padding:6px 2px;border-bottom:1px solid var(--line);align-items:baseline}
.chatLine .who{color:var(--gold);font-weight:700;white-space:nowrap}
.chatLine .rm{color:var(--mut);font-size:10.5px;white-space:nowrap}
.chatLine .tx{color:#C4CFDF;word-break:break-word}
.gLine{display:flex;gap:10px;font-size:12.5px;padding:7px 2px;border-bottom:1px solid var(--line)}
.gLine .w{color:#2FBF71;font-weight:700;min-width:90px}
.gLine .ts{color:var(--mut);font-size:10.5px;margin-left:auto;white-space:nowrap}
.mut{color:var(--mut)}
.empty{color:#5B6575;font-size:12.5px;padding:8px 0}
@media(max-width:600px){
  #scr-admin{padding:16px 12px 30px}
  .aHead h1{font-size:22px}
  th,td{padding:6px 7px;font-size:11px}
  td .pw{font-size:10px}
  .stat{padding:10px 12px}
  .stat .n{font-size:24px}
  .stat .l{font-size:9px;letter-spacing:1.2px}
  .aCard{padding:14px}
  .aBtn{padding:7px 11px;font-size:11px}
  .chatLine{font-size:11px}
  .gLine{font-size:11px;flex-wrap:wrap}
  .gLine .w{min-width:70px;font-size:10.5px}
  .pwForm input{min-width:100px;font-size:12px;padding:8px 10px}
}
</style>
</head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div></div>

<main id="scr-admin">
  <div class="aHead">
    <h1>📊 ADMIN <span>GACOR LUDO</span></h1>
    <div style="display:flex;gap:8px">
      <a class="aBtn" href="index.html">🎮 GAME</a>
      <button class="aBtn danger" id="lockBtn">🔒 KUNCI</button>
    </div>
  </div>

  <div id="lockCard" class="aCard">
    <h2>MASUK DASHBOARD</h2>
    <div class="pwForm">
      <input id="admCode" type="password" placeholder="kode admin" autocomplete="off">
      <button class="aBtn" id="admGo" style="background:var(--gold);color:#1A1408;border-color:var(--gold)">BUKA 🔓</button>
    </div>
    <div class="mut" style="font-size:11.5px">default: <b>GACOR-ADMIN</b> — ganti di bawah setelah masuk</div>
  </div>

  <div id="dash" hidden>
    <div class="statRow">
      <div class="stat"><div class="n" id="stUsers">0</div><div class="l">AKUN</div></div>
      <div class="stat"><div class="n" id="stOnline">0</div><div class="l">ONLINE</div></div>
      <div class="stat"><div class="n" id="stGames">0</div><div class="l">GAME</div></div>
      <div class="stat"><div class="n" id="stChat">0</div><div class="l">CHAT</div></div>
    </div>

    <div class="aCard">
      <h2>🟢 YANG ONLINE <span class="mut" id="onlineWhen"></span></h2>
      <div id="onlineList"></div>
    </div>

    <div class="aCard">
      <h2>👤 AKUN + PASSWORD <button class="aBtn" id="togglePw">👁️ TAMPILIN</button></h2>
      <div style="overflow-x:auto"><table id="userTable"></table></div>
    </div>

    <div class="aCard">
      <h2>💬 CHAT PEMAIN <button class="aBtn danger" id="clearChat">🗑️ HAPUS SEMUA</button></h2>
      <div id="chatView" style="max-height:280px;overflow-y:auto"></div>
    </div>

    <div class="aCard">
      <h2>🏆 RIWAYAT GAME</h2>
      <div id="gameView" style="max-height:280px;overflow-y:auto"></div>
    </div>

    <div class="aCard">
      <h2>⚙️ PENGATURAN</h2>
      <div class="pwForm">
        <input id="oldCode" type="password" placeholder="kode admin lama">
        <input id="newCode" type="password" placeholder="kode admin baru">
        <button class="aBtn" id="saveCode">GANTI KODE</button>
      </div>
      <div class="aBtns" style="margin-top:4px">
        <button class="aBtn" id="expBtn">⬇️ EXPORT DATABASE</button>
        <label class="aBtn" style="cursor:pointer">⬆️ IMPORT<input type="file" id="impFile" accept=".json" hidden></label>
        <button class="aBtn" id="admSnd">🔊 SUARA ADMIN TOAST</button>
      </div>
    </div>
  </div>
</main>

<script src="../js/db.js?v=4.5"></script>
<script src="../js/admin.js?v=4.5"></script>
</body>
</html>
